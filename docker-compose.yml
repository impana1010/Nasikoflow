version: "3.8"

services:
  agent1:
    image: python:3.12-slim
    ports:
      - "8001:8000"
    command: python -m http.server 8000

  agent2:
    image: python:3.12-slim
    ports:
      - "8002:8000"
    command: python -m http.server 8000

  agent3:
    image: python:3.12-slim
    ports:
      - "8003:8000"
    command: python -m http.server 8000

  router:
    build: ./router
    ports:
      - "8000:8000"
    depends_on:
      - agent1
      - agent2
      - agent3

  checker:
    build: ./router
    command: python checker.py
    depends_on:
      - router
      - agent1
      - agent2
      - agent3
